[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayhans-autonomous-lab"
version = "0.1.0"
description = "Rayhan's Autonomous Lab (RAL) — Self-verifying autonomous scientific knowledge vault"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.4",
    "PyYAML==6.0.3",
    "google-genai==3.6.1",
    "google-api-python-client==2.160.0",
    "google-auth-oauthlib==1.2.1",
    "sympy==1.13.3",
    "scipy==1.14.1",
    "numpy==2.1.3",
    "z3-solver==4.13.3.0",
    "hypothesis==6.119.0",
    "pint==0.24.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
