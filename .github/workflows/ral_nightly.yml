        continue-on-error: true
        with:
          name: ral-handoff-0
          path: .ral_handoff

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load cached air-gapped oracle sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/sandbox.Dockerfile
          tags: ral-sandbox:latest
          load: true
          cache-from: type=gha,scope=ral-sandbox

      - name: Run Epoch 1 epistemic pipeline
        env:
          RAL_GEMINI_FREE_KEY: ${{ secrets.RAL_GEMINI_FREE_KEY }}
          RAL_GDRIVE_CLIENT_ID: ${{ secrets.RAL_GDRIVE_CLIENT_ID }}
          RAL_GDRIVE_CLIENT_SECRET: ${{ secrets.RAL_GDRIVE_CLIENT_SECRET }}
          RAL_GDRIVE_REFRESH_TOKEN: ${{ secrets.RAL_GDRIVE_REFRESH_TOKEN }}
          RAL_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.RAL_GDRIVE_ROOT_FOLDER_ID }}
          RAL_GDRIVE_SA_JSON: ${{ secrets.RAL_GDRIVE_SA_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAL_DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          ARGS=(
            --repo-root .
            --handoff-dir .ral_handoff
            --cache-dir .ral_cache
            --ore-cache-dir /tmp/ore_cache
            --epoch-index 1
            --soft-stop-seconds 2880
          )
          if [ "${RAL_DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m ral.cli run-epoch "${ARGS[@]}"
          test -s .ral_handoff/epoch_1_summary.json

      - name: Upload Epoch 1 handoff artifacts (1-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ral-handoff-1
          path: .ral_handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Blocking pre-push validation gate and atomic push
        if: ${{ inputs.dry_run != true }}
        run: |
          python ci/validate_vault.py --root .
          python ci/pre_push_gate.py \
            --root . \
            --no-push \
            --message "feat(ral): epoch 1 verified knowledge commit (${GITHUB_RUN_ID})" \
            --paths vault/ ledger/ graph/ metrics/
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase origin main
            git push origin main
          fi

