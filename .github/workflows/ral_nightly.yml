name: RAL Nightly Autonomous Pipeline

on:
  schedule:
    # 10:13 PM MUT (UTC+4) == 18:13 UTC
    - cron: "13 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run full pipeline without pushing commits or swapping live Release assets"
        required: false
        type: boolean
        default: false
      available_epochs:
        description: "Maximum LLM epochs K to allocate (0..6)"
        required: false
        type: string
        default: "6"
      simulate_drive_fail:
        description: "Simulate Google Drive canary failure to test DRIVE_AUTH_FAIL circuit breaker"
        required: false
        type: boolean
        default: false
      run_date:
        description: "Optional ISO date override (YYYY-MM-DD)"
        required: false
        type: string
        default: ""

concurrency:
  group: ral-nightly-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  preflight_and_plan:
    name: "Job 0: Preflight & Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies and zstd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build air-gapped oracle sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/sandbox.Dockerfile
          tags: ral-sandbox:latest
          load: true
          cache-from: type=gha,scope=ral-sandbox
          cache-to: type=gha,mode=max,scope=ral-sandbox

      - name: Verify air-gapped Docker sandbox
        run: |
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --memory=1g --memory-swap=1g \
            --cpus=1 --pids-limit=64 \
            --user=65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            ral-sandbox:latest \
            python3 -c "import sympy, scipy, numpy, z3, hypothesis, pint; print('SANDBOX_READY')"

      - name: Run Job 0 preflight and curriculum planner
        env:
          RAL_GEMINI_FREE_KEY: ${{ secrets.RAL_GEMINI_FREE_KEY }}
          RAL_GDRIVE_CLIENT_ID: ${{ secrets.RAL_GDRIVE_CLIENT_ID }}
          RAL_GDRIVE_CLIENT_SECRET: ${{ secrets.RAL_GDRIVE_CLIENT_SECRET }}
          RAL_GDRIVE_REFRESH_TOKEN: ${{ secrets.RAL_GDRIVE_REFRESH_TOKEN }}
          RAL_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.RAL_GDRIVE_ROOT_FOLDER_ID }}
          RAL_GDRIVE_SA_JSON: ${{ secrets.RAL_GDRIVE_SA_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAL_DRY_RUN: ${{ inputs.dry_run == true }}
          RAL_AVAILABLE_EPOCHS: ${{ inputs.available_epochs || '6' }}
          RAL_SIMULATE_DRIVE_FAIL: ${{ inputs.simulate_drive_fail == true }}
          RAL_RUN_DATE: ${{ inputs.run_date }}
        run: |
          RUN_DATE="${RAL_RUN_DATE:-$(date -u +%Y-%m-%d)}"
          ARGS=(
            --repo-root .
            --handoff-dir .ral_handoff
            --cache-dir .ral_cache
            --date "$RUN_DATE"
            --epochs "${RAL_AVAILABLE_EPOCHS:-6}"
            --run-id "$GITHUB_RUN_ID"
          )
          if [ "${RAL_DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${RAL_SIMULATE_DRIVE_FAIL}" = "true" ]; then
            ARGS+=(--simulate-drive-fail)
          fi
          python -m ral.cli preflight "${ARGS[@]}"
          test -s .ral_handoff/plan.json
          test -s .ral_handoff/router_state.json
          test -s .ral_handoff/circuit_breaker.json

      - name: Upload Job 0 handoff artifacts (1-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ral-handoff-0
          path: .ral_handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Blocking pre-push gate and commit calibration/splits
        if: ${{ inputs.dry_run != true }}
        run: |
          python ci/validate_vault.py --root .
          python ci/pre_push_gate.py \
            --root . \
            --no-push \
            --message "chore(ral): update calibration benchmarks or leaf taxonomy (${GITHUB_RUN_ID})" \
            --paths metrics/model_benchmarks.json vault/
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase origin main
            git push origin main
          fi

  epoch_1:
    name: "Job 1: Epoch 1"
    needs: [preflight_and_plan]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
