          python ci/pre_push_gate.py \
            --root . \
            --no-push \
            --message "feat(ral): epoch 6 verified knowledge commit (${GITHUB_RUN_ID})" \
            --paths vault/ ledger/ graph/ metrics/
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase origin main
            git push origin main
          fi

  consolidate_and_watchdog:
    name: "Job 7: Consolidate & Watchdog"
    needs: [preflight_and_plan, epoch_6]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies and zstd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Download Epoch 6 handoff artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ral-handoff-6
          path: .ral_handoff

      - name: Run Job 7 consolidate, Blue-Green Release Swap, docs, and Dead-Man's Switch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAL_DRY_RUN: ${{ inputs.dry_run == true }}
          RAL_RUN_DATE: ${{ inputs.run_date }}
        run: |
          RUN_DATE="${RAL_RUN_DATE:-$(date -u +%Y-%m-%d)}"
          ARGS=(
            --repo-root .
            --handoff-dir .ral_handoff
            --cache-dir .ral_cache
            --date "$RUN_DATE"
            --run-id "$GITHUB_RUN_ID"
          )
          if [ "${RAL_DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m ral.cli consolidate "${ARGS[@]}"

      - name: Blocking pre-push gate and commit docs/telemetry
        if: ${{ inputs.dry_run != true }}
        run: |
          python ci/validate_vault.py --root .
          python ci/pre_push_gate.py \
            --root . \
            --no-push \
            --always-validate-vault \
            --message "chore(ral): consolidate nightly index docs and telemetry (${GITHUB_RUN_ID})" \
            --paths INDEX.md llms.txt metrics/telemetry/
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase origin main
            git push origin main
          fi
